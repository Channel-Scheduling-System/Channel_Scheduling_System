version: '3.8'

services:
    channel_postgres:
        image: postgres:17
        container_name: channel_postgres
        restart: always
        environment:
            POSTGRES_DB: channel_db
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: admin123
        ports:
            - '5433:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - channel-network

volumes:
    postgres_data:

networks:
    channel-network:
        driver: bridge
